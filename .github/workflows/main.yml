name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore ZenStatesDebugTool.sln

      - name: Build Debug
        run: msbuild ZenStatesDebugTool.sln /p:Configuration=Debug /p:Platform="Any CPU"

      - name: Build Release
        run: msbuild ZenStatesDebugTool.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SMUDebugTool-Release
          path: bin/Release/
